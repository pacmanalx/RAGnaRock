[package]
name = "nidhoggd"
version = "0.1.5"
edition = "2021"
description = "Níðhöggr — camada de inteligência do RAGnaRock. Worm autônomo que come o conhecimento das coleções via API. Daemon de módulos (porta 11497)."

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"   # Fase 3: aplica os moldes de extração (regex ancorado no rótulo) determinístico no L0
unicode-normalization = "0.1"   # NFC nos nomes de base/coleção (mesmo fix do ragd — NFD do macOS duplicava)
# [#53] porteira Laya: ONNX Runtime carregado dinamicamente (a lib do ambiente de treino, sem
# download no build) + tokenizador da Hugging Face em Rust puro (fancy-regex, sem C).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[[bin]]
name = "nidhoggd"
path = "src/main.rs"

[profile.release]
opt-level = 3
