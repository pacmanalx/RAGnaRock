[package]
name = "ragd"
version = "0.1.5"
edition = "2021"
description = "RAGnaRock daemon — segura N bases RAG em memoria; busca/ingest via HTTP JSON"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
rayon = "1"
# [#6] parking_lot — RwLock sem PoisonError, com starvation prevention nativo.
# RwLock dá N leitores concorrentes (search) + 1 escritor exclusivo (ingest/delete).
parking_lot = "0.12"
# [#33] normaliza nomes de base pra NFC — o macOS manda nomes de arquivo em NFD (drag&drop),
# senão "Locação" (ç/ã precompostos, NFC) e a forma decomposta viram DUAS bases distintas.
unicode-normalization = "0.1"
# [#33 JWT] sha2+hmac: HS256 do token e PBKDF2 das senhas (puro Rust, sem C)
sha2 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = 3
